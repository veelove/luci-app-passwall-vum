version: '3.8'

services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: passwall-builder
    volumes:
      - ./:/build
      - ./artifact:/build/artifact
    working_dir: /build
    environment:
      - TARGET_ARCH=x86_64
      # 默认 iStoreOS 25 / OpenWrt 24.10+，可改为 22.03.x 兼容旧版
      - SDK_VERSION=25.05.0
      - OPENSSL_TAG=libopenssl
      - BUILD_OPTION=standard
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    command: bash -c "chmod +x build.sh && ./build.sh $$TARGET_ARCH $$SDK_VERSION $$OPENSSL_TAG $$BUILD_OPTION"
