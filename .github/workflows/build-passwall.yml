name: Build PassWall for iStoreOS

# 修复版本：2025-08-30 20:45，解决安装过程中丢失登录状态问题

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: '目标架构'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_generic
      sdk_version:
        description: 'SDK 版本标记(决定 apk/ipk 选择)。24.10+/25.x -> apk;23.x/22.03 -> ipk'
        required: true
        default: '25.12.5'
      openssl_tag:
        description: 'OpenSSL 标记(25.x/24.10+ 用 libopenssl,23.x/22.03 用 libopenssl_1.1)'
        required: true
        default: 'libopenssl'
      build_option:
        description: '构建选项'
        required: true
        default: 'standard'
        type: choice
        options:
          - minimal
          - standard
          - full

permissions:
  contents: write

jobs:
  build:
    name: 构建 PassWall 安装包
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取日期
        id: date
        run: echo "date=$(date)" >> "$GITHUB_OUTPUT"

      - name: 准备环境
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself unzip curl jq
          rm -rf artifact/installer
          mkdir -p passwall-ipk artifact/installer staging

      - name: 下载 PassWall 包并解析版本
        id: fetch
        run: |
          set -e
          curl_gh() { curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          # 架构映射
          case "${{ inputs.target_arch }}" in
            x86_64) ARCH_MAP="x86_64" ;;
            aarch64_cortex-a53) ARCH_MAP="aarch64_cortex-a53" ;;
            *) ARCH_MAP="aarch64_generic" ;;
          esac
          echo "ARCH_MAP=$ARCH_MAP" >> "$GITHUB_ENV"

          # 最新 tag
          API_LATEST="https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/latest"
          RELEASE_DATA=$(curl_gh "$API_LATEST" || true)
          LATEST_VERSION=$(echo "$RELEASE_DATA" | jq -r .tag_name || true)
          [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ] && LATEST_VERSION="26.5.3-1"
          echo "LATEST_VERSION=$LATEST_VERSION" >> "$GITHUB_ENV"
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          # 从 GitHub release 中找到合适的 luci 包(根据 SDK_VERSION 优先选 apk 或 ipk)
          # OpenWrt 24.10+/25.x 优先选 .apk,OpenWrt 23.x 及更早选 .ipk
          case "${{ inputs.sdk_version }}" in
              25.*|24.*)
                  APP_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("luci-app-passwall.*\\.apk$")) | .browser_download_url' | head -n 1)
                  I18N_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("luci-i18n-passwall-zh-cn.*\\.apk$")) | .browser_download_url' | head -n 1)
                  ;;
              *)
                  APP_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("luci-app-passwall.*\\.ipk$")) | .browser_download_url' | head -n 1)
                  I18N_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("luci-i18n-passwall-zh-cn.*\\.ipk$")) | .browser_download_url' | head -n 1)
                  ;;
          esac

          if [ -n "$APP_URL" ] && [ "$APP_URL" != "null" ]; then
            echo "下载 APP: $APP_URL"
            curl -fL "$APP_URL" -o passwall-ipk/$(basename "$APP_URL")
          else
            echo "警告: 未在 release assets 中找到与 SDK_VERSION=${{ inputs.sdk_version }} 匹配的 luci-app-passwall 包"
          fi
          if [ -n "$I18N_URL" ] && [ "$I18N_URL" != "null" ]; then
            echo "下载 I18N: $I18N_URL"
            curl -fL "$I18N_URL" -o passwall-ipk/$(basename "$I18N_URL")
          else
            echo "警告: 未找到匹配的中文语言包"
          fi

          echo "已下载文件："
          ls -lh passwall-ipk/

      - name: 校验并定位 luci 顶层包（缺失则多源补齐）
        id: locate
        run: |
          set -e
          curl_gh() { curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          LATEST_VERSION="${LATEST_VERSION:?need version}"

          # 放宽匹配：apk 和 ipk 都接受
          find_app() { find passwall-ipk -type f \( -name '*luci-app-passwall*.ipk' -o -name '*luci-app-passwall*.apk' \) | head -n1 || true; }
          find_i18n() { find passwall-ipk -type f \( -name '*luci-i18n-passwall-zh-cn*.ipk' -o -name '*luci-i18n-passwall-zh-cn*.apk' \) | head -n1 || true; }

          APP_PKG="$(find_app)"; I18N_PKG="$(find_i18n)"

          fetch_from_release() {
            repo="$1"; tag="$2"
            if [ "$tag" = "latest" ]; then
              json="$(curl_gh "https://api.github.com/repos/$repo/releases/latest" || true)"
            else
              json="$(curl_gh "https://api.github.com/repos/$repo/releases/tags/$tag" || true)"
              [ -z "$json" ] && json="$(curl_gh "https://api.github.com/repos/$repo/releases/latest" || true)"
            fi
            [ -z "$json" ] && return 0
            if [ -z "$APP_PKG" ]; then
              # 放宽正则：任意前缀，apk/ipk 都接受
              url="$(echo "$json" | jq -r '.assets[] | select(.name|test(".*luci-app-passwall.*\\.(apk|ipk)$")) | .browser_download_url' | head -n1)"
              [ -n "$url" ] && [ "$url" != "null" ] && echo "下载 APP: $url (from $repo/$tag)" && curl -fL "$url" -o "passwall-ipk/$(basename "$url")" && APP_PKG="$(find_app)"
            fi
            if [ -z "$I18N_PKG" ]; then
              url="$(echo "$json" | jq -r '.assets[] | select(.name|test(".*luci-i18n-passwall-zh-cn.*\\.(apk|ipk)$")) | .browser_download_url' | head -n1)"
              [ -n "$url" ] && [ "$url" != "null" ] && echo "下载 I18N: $url (from $repo/$tag)" && curl -fL "$url" -o "passwall-ipk/$(basename "$url")" && I18N_PKG="$(find_i18n)"
            fi
          }

          # 若缺失则多源补齐
          if [ -z "$APP_PKG" ] || [ -z "$I18N_PKG" ]; then
            fetch_from_release "Openwrt-Passwall/openwrt-passwall" "$LATEST_VERSION"
            fetch_from_release "Openwrt-Passwall/openwrt-passwall" "latest"
            fetch_from_release "Openwrt-Passwall/openwrt-passwall" "$LATEST_VERSION"
            fetch_from_release "Openwrt-Passwall/openwrt-passwall" "latest"
          fi

          # 重新定位
          APP_PKG="$(find_app)"; I18N_PKG="$(find_i18n)"

          if [ -z "$APP_PKG" ]; then
            echo "未找到 luci-app-passwall 顶层包"
            find passwall-ipk -maxdepth 2 -type f \( -name '*.ipk' -o -name '*.apk' \) -print
            exit 1
          fi
          if [ -z "$I18N_PKG" ]; then
            echo "未找到 zh-cn 语言包"
            find passwall-ipk -maxdepth 2 -type f \( -name '*.ipk' -o -name '*.apk' \) -print
            exit 1
          fi

          echo "APP_PKG_PATH=$APP_PKG" >> "$GITHUB_ENV"
          echo "I18N_PKG_PATH=$I18N_PKG" >> "$GITHUB_ENV"
          echo "app_path=$APP_PKG" >> "$GITHUB_OUTPUT"
          echo "i18n_path=$I18N_PKG" >> "$GITHUB_OUTPUT"

          echo "定位结果："
          ls -lh "$APP_PKG" "$I18N_PKG"

      - name: 解析 luci-app-passwall 版本号（用于命名）
        id: parsever
        run: |
          set -e
          APP_PATH="${APP_PKG_PATH:-${{ steps.locate.outputs.app_path }}}"
          if [ -n "$APP_PATH" ]; then
            BASE="$(basename "$APP_PATH")"
            # 放宽正则:从任意前缀中提取 luci-app-passwall_<ver>,支持 _all.ipk 和 -<ver>.apk
            APPVER="$(echo "$BASE" | sed -E 's/^.*luci-app-passwall[_-]([^_.-]+).*/\1/')"
          fi
          if [ -z "${APPVER:-}" ] || [ "$APPVER" = "$BASE" ]; then
            LV="${{ steps.fetch.outputs.version }}"; APPVER="${LV%%-*}"
          fi
          echo "appver=$APPVER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$APPVER" >> "$GITHUB_ENV"

      - name: 下载最新核心（Xray/Sing-Box/Hysteria）并打包为 ipk
        id: cores
        run: |
          set -e
          curl_gh() { curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }

          ARCH_MAP="${ARCH_MAP:?}"
          # 目标架构 -> 上游二进制架构
          case "$ARCH_MAP" in
            x86_64) GOARCH=amd64 ;;
            aarch64_cortex-a53|aarch64_generic) GOARCH=arm64 ;;
            *) echo "错误: 不支持的架构 $ARCH_MAP"; exit 1 ;;
          esac
          echo "核心二进制架构: $GOARCH（ipk Architecture: $ARCH_MAP）"

          mkdir -p cores
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          # 通用 ipk 打包：mk_ipk <包名> <版本> <二进制路径>
          mk_ipk() {
            name="$1"; ver="$2"; bin="$3"
            d="$WORK/$name"
            mkdir -p "$d/control" "$d/data/usr/bin"
            install -m 0755 "$bin" "$d/data/usr/bin/$name"
            cat > "$d/control/control" <<EOF
          Package: $name
          Version: $ver
          Architecture: $ARCH_MAP
          Maintainer: passwall-builder
          Description: $name latest upstream binary
          EOF
            tar -C "$d/control" -czf "$d/control.tar.gz" .
            tar -C "$d/data" -czf "$d/data.tar.gz" .
            printf '2.0\n' > "$d/debian-binary"
            tar -C "$d" -czf "cores/${name}_${ver}_${ARCH_MAP}.ipk" debian-binary control.tar.gz data.tar.gz
            # 同时生成 apk 格式副本(apk 工具链对不带签名的 ipk 结构也能 add)
            tar -C "$d" -czf "cores/${name}_${ver}_${ARCH_MAP}.apk" control.tar.gz data.tar.gz
            echo "已打包: cores/${name}_${ver}_${ARCH_MAP}.{ipk,apk}"
          }

          # ---------- Xray（上游所有 release 均标记为 prerelease，取列表第一个最新 tag） ----------
          XRAY_VER="$(curl_gh "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=1" | jq -r '.[0].tag_name' | sed 's/^v//')"
          if [ "$GOARCH" = amd64 ]; then XRAY_ASSET="Xray-linux-64.zip"; else XRAY_ASSET="Xray-linux-arm64-v8a.zip"; fi
          echo "下载 Xray v$XRAY_VER ($XRAY_ASSET) ..."
          curl -fL "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VER}/${XRAY_ASSET}" -o "$WORK/xray.zip"
          mkdir -p "$WORK/xray-extract"
          unzip -oq "$WORK/xray.zip" xray -d "$WORK/xray-extract"
          mk_ipk xray "$XRAY_VER" "$WORK/xray-extract/xray"

          # ---------- Sing-Box（取最新稳定版，跳过 alpha/beta/rc；OpenWrt 为 musl libc，必须用 musl 变体） ----------
          SB_VER="$(curl_gh "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | jq -r .tag_name | sed 's/^v//')"
          SB_ASSET="sing-box-${SB_VER}-linux-${GOARCH}-musl.tar.gz"
          echo "下载 Sing-Box v$SB_VER ($SB_ASSET) ..."
          curl -fL "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${SB_ASSET}" -o "$WORK/sing-box.tar.gz"
          mkdir -p "$WORK/sb-extract"
          tar -xzf "$WORK/sing-box.tar.gz" -C "$WORK/sb-extract"
          SB_BIN="$(find "$WORK/sb-extract" -type f -name sing-box | head -n1)"
          [ -n "$SB_BIN" ] || { echo "错误: sing-box 二进制解压失败"; exit 1; }
          mk_ipk sing-box "$SB_VER" "$SB_BIN"

          # ---------- Hysteria（取最新稳定版，tag 形如 app/v2.12.2） ----------
          HY_TAG="$(curl_gh "https://api.github.com/repos/apernet/hysteria/releases/latest" | jq -r .tag_name)"
          HY_VER="$(echo "$HY_TAG" | sed 's#.*/v##')"
          HY_TAG_ENC="$(printf '%s' "$HY_TAG" | sed 's#/#%2F#g')"
          HY_ASSET="hysteria-linux-${GOARCH}"
          echo "下载 Hysteria v$HY_VER ($HY_ASSET) ..."
          mkdir -p "$WORK/hy-extract"
          curl -fL "https://github.com/apernet/hysteria/releases/download/${HY_TAG_ENC}/${HY_ASSET}" -o "$WORK/hy-extract/hysteria"
          mk_ipk hysteria "$HY_VER" "$WORK/hy-extract/hysteria"

          echo "XRAY_VERSION=$XRAY_VER" >> "$GITHUB_ENV"
          echo "SINGBOX_VERSION=$SB_VER" >> "$GITHUB_ENV"
          echo "HYSTERIA_VERSION=$HY_VER" >> "$GITHUB_ENV"
          echo "xray=$XRAY_VER" >> "$GITHUB_OUTPUT"
          echo "singbox=$SB_VER" >> "$GITHUB_OUTPUT"
          echo "hysteria=$HY_VER" >> "$GITHUB_OUTPUT"

          echo "最新核心打包结果："
          ls -lh cores/

      - name: 构建 Makeself 安装包（调用统一 build.sh）
        run: |
          set -e
          # 直接复用 build.sh,它内部会根据 SDK_VERSION 自动选 apk/opkg,
          # 并写入新的 install.sh（运行时探测 apk/opkg）,
          # 也包含 .sdk_version 标记。workflow 不再内嵌老式 opkg-only 安装脚本。
          chmod +x build.sh
          TARGET_ARCH="${{ inputs.target_arch }}" \
          SDK_VERSION="${{ inputs.sdk_version }}" \
          OPENSSL_TAG="${{ inputs.openssl_tag }}" \
          BUILD_OPTION="${{ inputs.build_option }}" \
          ./build.sh "${{ inputs.target_arch }}" "${{ inputs.sdk_version }}" "${{ inputs.openssl_tag }}" "${{ inputs.build_option }}"

          # 在 version.txt 里追加一些 workflow 专属信息
          {
            echo "上游Release Tag: ${{ steps.fetch.outputs.version }}"
            echo "Xray版本: ${{ steps.cores.outputs.xray }}"
            echo "Sing-Box版本: ${{ steps.cores.outputs.singbox }}"
            echo "Hysteria版本: ${{ steps.cores.outputs.hysteria }}"
            echo "构建时间: ${{ steps.date.outputs.date }}"
            echo "GitHub Actions运行ID: ${{ github.run_id }}"
          } >> artifact/installer/version.txt 2>/dev/null || true

          echo "构建产物:"
          ls -lh artifact/installer/

          # 从生成的文件名中解析 APPVER,供后续步骤使用
          RUN_FILE="$(ls artifact/installer/PassWall_*.run 2>/dev/null | head -n1)"
          if [ -n "$RUN_FILE" ]; then
            RUN_BASE="$(basename "$RUN_FILE")"
            APPVER="$(echo "$RUN_BASE" | sed -E 's/^PassWall_([^_]+)_.*/\1/')"
            echo "APPVER=$APPVER" >> "$GITHUB_ENV"
            echo "RUN_FILE=$RUN_FILE" >> "$GITHUB_ENV"
          fi

      - name: 上传安装程序
        uses: actions/upload-artifact@v4
        with:
          name: PassWall_${{ env.APPVER }}_${{ inputs.target_arch }}_all_sdk_${{ inputs.sdk_version }}
          path: ./artifact/installer/

      - name: 创建发布
        uses: softprops/action-gh-release@v1
        with:
          tag_name: passwall-${{ inputs.target_arch }}-${{ env.APPVER }}-${{ github.run_id }}
          name: PassWall ${{ env.APPVER }} for iStoreOS (${{ inputs.target_arch }})
          files: |
            ${{ env.RUN_FILE }}
            artifact/installer/version.txt
          body: |
            ## PassWall ${{ env.APPVER }} for iStoreOS - ${{ inputs.target_arch }}
            
            PassWall(luci-app)版本: ${{ env.APPVER }}
            上游Release Tag: ${{ steps.fetch.outputs.version }}
            Xray版本: ${{ steps.cores.outputs.xray }}
            Sing-Box版本: ${{ steps.cores.outputs.singbox }}
            Hysteria版本: ${{ steps.cores.outputs.hysteria }}
            SDK版本: ${{ inputs.sdk_version }}
            OpenSSL标记: ${{ inputs.openssl_tag }}
            构建时间: ${{ steps.date.outputs.date }}
            目标架构: ${{ inputs.target_arch }}
            GitHub Actions运行ID: ${{ github.run_id }}
            构建选项: ${{ inputs.build_option }}
            
            ### 安装方法
            
            1. 下载 `PassWall_${{ env.APPVER }}_${{ inputs.target_arch }}_all_sdk_${{ inputs.sdk_version }}.run` 到路由器
            2. 执行 `chmod +x PassWall_${{ env.APPVER }}_${{ inputs.target_arch }}_all_sdk_${{ inputs.sdk_version }}.run && ./PassWall_${{ env.APPVER }}_${{ inputs.target_arch }}_all_sdk_${{ inputs.sdk_version }}.run`
            3. 完成后，在LuCI界面中访问 服务→PassWall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}