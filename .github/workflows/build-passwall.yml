name: Build PassWall for iStoreOS

# 修复版本：2025-08-30 20:45，解决安装过程中丢失登录状态问题

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: '目标架构'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_generic
      sdk_version:
        description: 'SDK 版本标记（用于文件名和标签；22.03.x 兼容旧版，23.05/24.10 用 ipk，25.x 用于 iStoreOS 25 / OpenWrt 24.10+ 用 apk）'
        required: true
        default: '25.05.0'
      openssl_tag:
        description: 'OpenSSL 标记（用于标签；OpenSSL 3 写 libopenssl，旧版 22.03 用 libopenssl_1.1）'
        required: true
        default: 'libopenssl'
      build_option:
        description: '构建选项'
        required: true
        default: 'standard'
        type: choice
        options:
          - minimal
          - standard
          - full

permissions:
  contents: write

jobs:
  build:
    name: 构建 PassWall 安装包
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取日期
        id: date
        run: echo "date=$(date)" >> "$GITHUB_OUTPUT"

      - name: 准备环境
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself unzip curl jq
          rm -rf artifact/installer
          mkdir -p passwall-ipk artifact/installer staging

      - name: 下载 PassWall 包并解析版本
        id: fetch
        run: |
          set -e
          curl_gh() { curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          # 架构映射
          case "${{ inputs.target_arch }}" in
            x86_64) ARCH_MAP="x86_64" ;;
            aarch64_cortex-a53) ARCH_MAP="aarch64_cortex-a53" ;;
            *) ARCH_MAP="aarch64_generic" ;;
          esac
          echo "ARCH_MAP=$ARCH_MAP" >> "$GITHUB_ENV"

          # 最新 tag
          API_LATEST="https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/latest"
          RELEASE_DATA=$(curl_gh "$API_LATEST" || true)
          LATEST_VERSION=$(echo "$RELEASE_DATA" | jq -r .tag_name || true)
          [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ] && LATEST_VERSION="26.9.16-1"
          echo "LATEST_VERSION=$LATEST_VERSION" >> "$GITHUB_ENV"
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          SDK_VERSION="${{ inputs.sdk_version }}"
          case "$SDK_VERSION" in
            22.03*|19.07*|18.06*|23.05*|24.10*)
              # ---- opkg/ipk 场景：从 GitHub release 下载主包 + 语言包 ----
              case "$SDK_VERSION" in
                22.03*|19.07*|18.06*)
                  APP_PAT='^22\.03-.*luci-app-passwall.*\.ipk$'
                  I18N_PAT='^22\.03-.*luci-i18n-passwall-zh-cn.*\.ipk$'
                  ;;
                *)
                  APP_PAT='^23\.05-24\.10.*luci-app-passwall.*\.ipk$'
                  I18N_PAT='^23\.05-24\.10.*luci-i18n-passwall-zh-cn.*\.ipk$'
                  ;;
              esac

              APP_URL=$(echo "$RELEASE_DATA" | jq -r --arg pat "$APP_PAT" '.assets[] | select(.name | test($pat)) | .browser_download_url' | head -n 1)
              I18N_URL=$(echo "$RELEASE_DATA" | jq -r --arg pat "$I18N_PAT" '.assets[] | select(.name | test($pat)) | .browser_download_url' | head -n 1)

              # 未匹配则回退通用匹配
              if [ -z "$APP_URL" ] || [ "$APP_URL" = "null" ]; then
                echo "警告: SDK_VERSION=$SDK_VERSION 未匹配到对应格式，回退到通用匹配..."
                APP_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("luci-app-passwall.*\\.ipk$")) | .browser_download_url' | head -n 1)
                I18N_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("luci-i18n-passwall-zh-cn.*\\.ipk$")) | .browser_download_url' | head -n 1)
              fi

              echo "下载 APP: $APP_URL"
              curl -fL "$APP_URL" -o passwall-ipk/$(basename "$APP_URL")
              echo "下载 I18N: $I18N_URL"
              curl -fL "$I18N_URL" -o passwall-ipk/$(basename "$I18N_URL")

              # shadowsocksr-libev 的 ipk：22.03 上游未发布；23.05 / 24.10 仅 x86_64。
              # SourceForge 的目录按 SDK 版本号分段，固定路径 packages-22.03 / -23.05 / -24.10。
              case "$SDK_VERSION" in
                22.03*|19.07*|18.06*)
                  SF_PKG_BASE="https://sourceforge.net/projects/openwrt-passwall-build/files/releases/packages-22.03"
                  SF_PKG_RSS_URL="https://sourceforge.net/projects/openwrt-passwall-build/rss?path=/releases/packages-22.03/x86_64/passwall_packages"
                  SF_PKG_ENABLE="0"
                  ;;
                23.05*)
                  SF_PKG_BASE="https://sourceforge.net/projects/openwrt-passwall-build/files/releases/packages-23.05"
                  SF_PKG_RSS_URL="https://sourceforge.net/projects/openwrt-passwall-build/rss?path=/releases/packages-23.05/x86_64/passwall_packages"
                  SF_PKG_ARCH="x86_64"
                  SF_PKG_ENABLE="1"
                  ;;
                24.10*)
                  SF_PKG_BASE="https://sourceforge.net/projects/openwrt-passwall-build/files/releases/packages-24.10"
                  SF_PKG_RSS_URL="https://sourceforge.net/projects/openwrt-passwall-build/rss?path=/releases/packages-24.10/x86_64/passwall_packages"
                  SF_PKG_ARCH="x86_64"
                  SF_PKG_ENABLE="1"
                  ;;
              esac
              if [ "${SF_PKG_ENABLE:-0}" = "1" ]; then
                SF_PKG_RSS="$(curl -fsSL "$SF_PKG_RSS_URL" 2>/dev/null || true)"
                ssr_ipk_redir="$(printf "%s" "$SF_PKG_RSS" | grep -oE 'shadowsocksr-libev-ssr-redir_[^"<>]*\.ipk' | grep -E '_x86_64\.ipk$' | sort -V | tail -n1)"
                [ -z "$ssr_ipk_redir" ] && ssr_ipk_redir="shadowsocksr-libev-ssr-redir_2.5.6-r13_x86_64.ipk"
                ssr_ipk_ver="$(printf "%s" "$ssr_ipk_redir" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
                [ -z "$ssr_ipk_ver" ] && ssr_ipk_ver="2.5.6"
                ssr_ipk_rev="$(printf "%s" "$ssr_ipk_redir" | grep -oE '[-_]r?[0-9]+_x86_64\.ipk$' | head -n1)"
                [ -z "$ssr_ipk_rev" ] && ssr_ipk_rev="-r13_x86_64.ipk"
                for role in check local nat redir server; do
                  file="$(printf "%s" "$SF_PKG_RSS" | grep -oE "shadowsocksr-libev-ssr-${role}_[^\"<>]*\.ipk" | grep -E '_x86_64\.ipk$' | sort -V | tail -n1)"
                  [ -z "$file" ] && file="shadowsocksr-libev-ssr-${role}_${ssr_ipk_ver}${ssr_ipk_rev}"
                  if curl -fL "$SF_PKG_BASE/$SF_PKG_ARCH/passwall_packages/$file" -o "passwall-ipk/$file"; then
                    echo "✓ SSR 核心: $file"
                  else
                    echo "警告: 无法下载 SSR 核心 $role (尝试 $file)"
                  fi
                done
              fi
              ;;
            *)
              # ---- apk 场景（25.x / OpenWrt 25.12+）：luci 主包/i18n 从 GitHub release 取，依赖从 SourceForge 取 ----
              SF_ARCH="$ARCH_MAP"
              SF_BASE="https://sourceforge.net/projects/openwrt-passwall-build/files/releases/packages-25.12/$SF_ARCH"

              # luci 主包与 i18n：直接从 GitHub release assets 拉（命名固定 25.12+_luci-app-passwall-<ver>[-rN].apk），
              # 不依赖 SourceForge RSS，避免 SF 同步滞后导致版本停在旧版。
              # 取到的资产 URL 形如：
              #   .../25.12+_luci-app-passwall-26.9.26-r1.apk
              #   .../25.12+_luci-i18n-passwall-zh-cn-26.9.26.apk
              APP_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("^25\\.12\\+_luci-app-passwall-.*\\.apk$")) | .browser_download_url' | head -n 1)
              I18N_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("^25\\.12\\+_luci-i18n-passwall-zh-cn-.*\\.apk$")) | .browser_download_url' | head -n 1)

              if [ -z "$APP_URL" ] || [ "$APP_URL" = "null" ]; then
                echo "警告: GitHub release 未找到 25.12+ apk 主包，回退到 SourceForge RSS..."
                RSS_LUCI="$(curl -fsSL "https://sourceforge.net/projects/openwrt-passwall-build/rss?path=/releases/packages-25.12/$SF_ARCH/passwall_luci" 2>/dev/null || true)"
                LUCI_FILE="$(echo "$RSS_LUCI" | grep -oE 'luci-app-passwall-[0-9.]+(-r[0-9]+)?\.apk' | sort -V | tail -n1)"
                [ -z "$LUCI_FILE" ] && LUCI_FILE="luci-app-passwall-26.9.16-r1.apk"
                APP_URL="$SF_BASE/passwall_luci/$LUCI_FILE"
              fi
              if [ -z "$I18N_URL" ] || [ "$I18N_URL" = "null" ]; then
                RSS_LUCI="$(curl -fsSL "https://sourceforge.net/projects/openwrt-passwall-build/rss?path=/releases/packages-25.12/$SF_ARCH/passwall_luci" 2>/dev/null || true)"
                I18N_FILE="$(echo "$RSS_LUCI" | grep -oE 'luci-i18n-passwall-zh-cn-[0-9.]+(-r[0-9]+)?\.apk' | sort -V | tail -n1)"
                [ -z "$I18N_FILE" ] && I18N_FILE="luci-i18n-passwall-zh-cn-26.9.16.apk"
                I18N_URL="$SF_BASE/passwall_luci/$I18N_FILE"
              fi

              LUCI_FILE="$(basename "$APP_URL")"
              I18N_FILE="$(basename "$I18N_URL")"
              echo "上游 luci 包: $LUCI_FILE / $I18N_FILE"

              echo "下载 PassWall 主程序与语言包 (apk)..."
              curl -fL "$APP_URL" -o "passwall-ipk/$LUCI_FILE"
              curl -fL "$I18N_URL" -o "passwall-ipk/$I18N_FILE" || echo "警告: 无法下载中文语言包"

              # 下载核心依赖 apk（仍走 SourceForge）
              RSS_PKG="$(curl -fsSL "https://sourceforge.net/projects/openwrt-passwall-build/rss?path=/releases/packages-25.12/$SF_ARCH/passwall_packages" 2>/dev/null || true)"
              sf_probe() {
                echo "$RSS_PKG" | grep -oE "$1" | sort -V | tail -n1
              }
              DEP_NAMES="chinadns-ng dns2socks tcping geoview xray-core sing-box hysteria v2ray-geoip v2ray-geosite"
              FALLBACK=(
                "chinadns-ng-2025.08.09-r1.apk"
                "dns2socks-2.1-r2.apk"
                "tcping-0.3-r1.apk"
                "geoview-0.2.6-r1.apk"
                "xray-core-26.9.9-r1.apk"
                "sing-box-1.14.1-r1.apk"
                "hysteria-2.12.3-r1.apk"
                "v2ray-geoip-202609040655.1.apk"
                "v2ray-geosite-202609072354.1.apk"
              )
              i=0
              for dep in $DEP_NAMES; do
                file="$(sf_probe "${dep}-[0-9.]+-r[0-9]+\.apk")"
                [ -z "$file" ] && [ "$dep" = "v2ray-geoip" ] && file="$(sf_probe 'v2ray-geoip-[0-9]+\.apk')"
                [ -z "$file" ] && [ "$dep" = "v2ray-geosite" ] && file="$(sf_probe 'v2ray-geosite-[0-9]+\.apk')"
                [ -z "$file" ] && file="${FALLBACK[$i]}"
                if curl -fL "$SF_BASE/passwall_packages/$file" -o "passwall-ipk/$file"; then
                  echo "✓ 依赖: $file"
                else
                  echo "警告: 无法下载依赖 $dep (尝试 $file)"
                fi
                i=$((i+1))
              done

              # shadowsocksr-libev：apk 主包中 ssr 节点依赖 ssr-redir 等核心
              # SourceForge 25.12 三个架构均已发布，统一从 RSS 探测；探测失败回退 2.5.6-r13。
              SSR_ROLES="check local nat redir server"
              ssr_file="$(echo "$RSS_PKG" | grep -oE 'shadowsocksr-libev-ssr-redir-[0-9.]+-r[0-9]+\.apk' | sort -V | tail -n1)"
              [ -z "$ssr_file" ] && ssr_file="shadowsocksr-libev-ssr-redir-2.5.6-r13.apk"
              ssr_ver="$(echo "$ssr_file" | sed -E 's/^shadowsocksr-libev-ssr-redir-([0-9.]+)-r[0-9]+\.apk$/\1/')"
              [ -z "$ssr_ver" ] && ssr_ver="2.5.6"
              for role in $SSR_ROLES; do
                file="$(echo "$RSS_PKG" | grep -oE "shadowsocksr-libev-ssr-${role}-${ssr_ver}-r[0-9]+\\.apk" | sort -V | tail -n1)"
                [ -z "$file" ] && file="shadowsocksr-libev-ssr-${role}-${ssr_ver}-r13.apk"
                if curl -fL "$SF_BASE/passwall_packages/$file" -o "passwall-ipk/$file"; then
                  echo "✓ SSR 核心: $file"
                else
                  echo "警告: 无法下载 SSR 核心 $role (尝试 $file)"
                fi
              done
              ;;
          esac

          echo "已下载文件："
          ls -lh passwall-ipk/

      - name: 校验并定位 luci 顶层包（缺失则多源补齐）
        id: locate
        run: |
          set -e
          curl_gh() { curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          LATEST_VERSION="${LATEST_VERSION:?need version}"

          # 放宽匹配：兼容 ipk 与 apk
          find_app() { find passwall-ipk -type f -name '*luci-app-passwall*' \( -name '*.ipk' -o -name '*.apk' \) | head -n1 || true; }
          find_i18n() { find passwall-ipk -type f -name '*luci-i18n-passwall-zh-cn*' \( -name '*.ipk' -o -name '*.apk' \) | head -n1 || true; }

          APP_PKG="$(find_app)"; I18N_PKG="$(find_i18n)"

          fetch_from_release() {
            repo="$1"; tag="$2"
            if [ "$tag" = "latest" ]; then
              json="$(curl_gh "https://api.github.com/repos/$repo/releases/latest" || true)"
            else
              json="$(curl_gh "https://api.github.com/repos/$repo/releases/tags/$tag" || true)"
              [ -z "$json" ] && json="$(curl_gh "https://api.github.com/repos/$repo/releases/latest" || true)"
            fi
            [ -z "$json" ] && return 0
            if [ -z "$APP_PKG" ]; then
              # 放宽正则：任意前缀，任意后缀（兼容 ipk/apk）
              url="$(echo "$json" | jq -r '.assets[] | select(.name|test(".*luci-app-passwall.*\\.(ipk|apk)$")) | .browser_download_url' | head -n1)"
              [ -n "$url" ] && [ "$url" != "null" ] && echo "下载 APP: $url (from $repo/$tag)" && curl -fL "$url" -o "passwall-ipk/$(basename "$url")" && APP_PKG="$(find_app)"
            fi
            if [ -z "$I18N_PKG" ]; then
              # 放宽正则：任意前缀，任意后缀（兼容 ipk/apk）
              url="$(echo "$json" | jq -r '.assets[] | select(.name|test(".*luci-i18n-passwall-zh-cn.*\\.(ipk|apk)$")) | .browser_download_url' | head -n1)"
              [ -n "$url" ] && [ "$url" != "null" ] && echo "下载 I18N: $url (from $repo/$tag)" && curl -fL "$url" -o "passwall-ipk/$(basename "$url")" && I18N_PKG="$(find_i18n)"
            fi
          }

          # 若缺失则多源补齐
          if [ -z "$APP_PKG" ] || [ -z "$I18N_PKG" ]; then
            fetch_from_release "Openwrt-Passwall/openwrt-passwall" "$LATEST_VERSION"
            fetch_from_release "Openwrt-Passwall/openwrt-passwall" "latest"
            fetch_from_release "Openwrt-Passwall/openwrt-passwall" "$LATEST_VERSION"
            fetch_from_release "Openwrt-Passwall/openwrt-passwall" "latest"
          fi

          # 重新定位
          APP_PKG="$(find_app)"; I18N_PKG="$(find_i18n)"

          if [ -z "$APP_PKG" ]; then
            echo "未找到 luci-app-passwall 顶层包"
            find passwall-ipk -maxdepth 2 -type f \( -name '*.ipk' -o -name '*.apk' \) -print
            exit 1
          fi
          if [ -z "$I18N_PKG" ]; then
            echo "未找到 zh-cn 语言包"
            find passwall-ipk -maxdepth 2 -type f \( -name '*.ipk' -o -name '*.apk' \) -print
            exit 1
          fi

          echo "APP_PKG_PATH=$APP_PKG" >> "$GITHUB_ENV"
          echo "I18N_PKG_PATH=$I18N_PKG" >> "$GITHUB_ENV"
          echo "app_path=$APP_PKG" >> "$GITHUB_OUTPUT"
          echo "i18n_path=$I18N_PKG" >> "$GITHUB_OUTPUT"

          echo "定位结果："
          ls -lh "$APP_PKG" "$I18N_PKG"

      - name: 解析 luci-app-passwall 版本号（用于命名，兼容 ipk/apk）
        id: parsever
        run: |
          set -e
          APP_PATH="${APP_PKG_PATH:-${{ steps.locate.outputs.app_path }}}"
          if [ -n "$APP_PATH" ]; then
            BASE="$(basename "$APP_PATH")"
            # 兼容 ipk：22.03-_luci-app-passwall_26.9.16_all.ipk；apk：25.12+_luci-app-passwall-26.9.16-r1.apk
            APPVER="$(echo "$BASE" | sed -E 's/^.*luci-app-passwall[-_]([0-9.]+)[^_]*\.(ipk|apk)$/\1/')"
          fi
          if [ -z "${APPVER:-}" ] || [ "$APPVER" = "$BASE" ]; then
            LV="${{ steps.fetch.outputs.version }}"; APPVER="${LV%%-*}"
          fi
          echo "appver=$APPVER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$APPVER" >> "$GITHUB_ENV"

      - name: 构建 Makeself 安装包（完全对齐样例结构/逻辑）
        run: |
          set -e
          ARCH_MAP="${ARCH_MAP:-${{ inputs.target_arch }}}"
          LATEST_VERSION="${LATEST_VERSION:-${{ steps.fetch.outputs.version }}}"
          APP_VERSION="${APP_VERSION:-${{ steps.parsever.outputs.appver }}}"
          SDK_VERSION="${{ inputs.sdk_version }}"
          OPENSSL_TAG="${{ inputs.openssl_tag }}"
          APP_PKG_PATH="${APP_PKG_PATH:-${{ steps.locate.outputs.app_path }}}"
          I18N_PKG_PATH="${I18N_PKG_PATH:-${{ steps.locate.outputs.i18n_path }}}"

          echo "将打包的顶层包："
          ls -lh "$APP_PKG_PATH" "$I18N_PKG_PATH"

          STAGING_ROOT="staging"
          STAGING_DIR="$STAGING_ROOT/$ARCH_MAP"
          DEP_DIR="$STAGING_DIR/depends"
          rm -rf "$STAGING_DIR"
          mkdir -p "$DEP_DIR"

          # 复制为固定文件名，避免通配匹配（保留扩展名 ipk/apk）
          APP_BASE="$(basename "$APP_PKG_PATH")"
          I18N_BASE="$(basename "$I18N_PKG_PATH")"
          APP_EXT="${APP_BASE##*.}"
          I18N_EXT="${I18N_BASE##*.}"
          cp -f "$APP_PKG_PATH" "$STAGING_DIR/$APP_BASE"
          cp -f "$APP_PKG_PATH" "$STAGING_DIR/luci-app-passwall.$APP_EXT"  # 固定名称
          cp -f "$I18N_PKG_PATH" "$STAGING_DIR/$I18N_BASE"
          cp -f "$I18N_PKG_PATH" "$STAGING_DIR/luci-i18n-passwall-zh-cn.$I18N_EXT"  # 固定名称

          # 复制仓库中的 depends 目录（从老版本提取的完整依赖包）
          if [ -d depends ]; then
            echo "复制依赖包..."
            cp -r depends/* "$DEP_DIR/"
          fi

          # 25.x / OpenWrt 25.12+ 使用 apk：把 download 步骤下载的原生 apk 依赖全部放入 depends/
          # 供 install.sh 直接 apk add --allow-untrusted depends/*.apk
          # xray-core / sing-box / hysteria 已在 fetch 步骤从 SourceForge 下载到 passwall-ipk/，
          # 在这里一并复制进 depends/，无需在 build 时再单独打包核心。
          if [ "$SDK_VERSION" != "22.03"* ] && [ "$SDK_VERSION" != "19.07"* ] && [ "$SDK_VERSION" != "18.06"* ] \
             && [ "$SDK_VERSION" != "23.05"* ] && [ "$SDK_VERSION" != "24.10"* ]; then
            # 25.x: 把 fetch 步骤下载的 apk 依赖全部复制进 depends/
            if ls passwall-ipk/*.apk >/dev/null 2>&1; then
              echo "复制 25.x apk 依赖到 depends/..."
              for f in passwall-ipk/*.apk; do
                cp -f "$f" "$DEP_DIR/"
              done
            fi
          fi

          echo "打包目录预览："
          find "$STAGING_DIR" -maxdepth 2 -type f -print | sed -n '1,200p'

          # 生成安装脚本（支持 apk/opkg 双包管理器，按 SDK 版本分支）
          cat > "$STAGING_DIR/install.sh" <<'EOF'
          #!/bin/sh
          set -e

          # 由构建脚本写入的 SDK 版本标记，用于运行时选择依赖与刷新策略
          SDK_VERSION="$(cat .sdk_version 2>/dev/null || echo @SDK_VERSION@)"

          # 探测包管理器：iStoreOS 25 / OpenWrt 24.10+ 用 apk，OpenWrt 22.03/23.05 用 opkg
          PKG_MGR=""
          if command -v apk >/dev/null 2>&1; then
              PKG_MGR="apk"
          elif command -v opkg >/dev/null 2>&1; then
              PKG_MGR="opkg"
          fi
          echo "检测到包管理器: ${PKG_MGR:-未找到}"

          # 检查依赖是否已安装（按包管理器）
          is_installed() {
              dep="$1"
              if [ "$PKG_MGR" = "apk" ]; then
                  apk info -e "$dep" >/dev/null 2>&1
              else
                  opkg list-installed 2>/dev/null | grep -q "^$dep "
              fi
          }

          # 安装依赖（按包管理器）
          install_dep() {
              dep="$1"
              if [ "$PKG_MGR" = "apk" ]; then
                  if ! apk add -q --force-overwrite --clean-protected --allow-untrusted "$dep"; then
                      echo "警告: 无法安装 $dep"
                      return 1
                  fi
              elif [ "$PKG_MGR" = "opkg" ]; then
                  if ! opkg install "$dep"; then
                      echo "警告: 无法安装 $dep"
                      return 1
                  fi
              else
                  echo "错误: 未找到包管理器，无法安装 $dep"
                  return 1
              fi
          }

          # 检查并安装 PassWall 必需依赖
          check_passwall_deps() {
            echo "检查 PassWall 必需依赖..."

            if [ "$PKG_MGR" = "apk" ]; then
              # apk 幂等：逐个安装，已安装的包自动跳过（返回 0 且无输出），
              # 只有真正失败时才打印警告，避免把"已装好"误报成"缺失依赖"。
              local deps="iptables-mod-tproxy iptables-mod-socket iptables-mod-iprange iptables-mod-conntrack-extra kmod-ipt-tproxy kmod-ipt-socket kmod-ipt-iprange kmod-ipt-conntrack-extra ip-full ipset iptables-mod-extra iptables-mod-filter"
              for dep in $deps; do
                if ! apk add -q --force-overwrite --clean-protected --allow-untrusted "$dep"; then
                  echo "警告: 无法安装 $dep，可能需要手动处理"
                fi
              done
            else
              # iptables 透明代理模块
              local iptables_deps="iptables-mod-tproxy iptables-mod-socket iptables-mod-iprange iptables-mod-conntrack-extra"
              local kernel_deps="kmod-ipt-tproxy kmod-ipt-socket kmod-ipt-iprange kmod-ipt-conntrack-extra"

              for dep in $iptables_deps $kernel_deps; do
                if ! is_installed "$dep"; then
                  echo "安装缺失依赖: $dep"
                  install_dep "$dep" || echo "警告: 无法安装 $dep，可能需要手动处理"
                fi
              done

              # 其他常用依赖
              local other_deps="ip-full ipset iptables-mod-extra iptables-mod-filter"
              for dep in $other_deps; do
                if ! is_installed "$dep"; then
                  echo "安装推荐依赖: $dep"
                  install_dep "$dep" || true
                fi
              done
            fi
          }

          # 温和地刷新 LuCI 缓存（不重启服务，避免丢失登录状态）
          refresh_luci() {
            # 清理缓存文件
            rm -f /tmp/luci-indexcache 2>/dev/null || true
            rm -rf /tmp/luci-modulecache/* 2>/dev/null || true

            # 优先使用 luci-reload（如果可用）
            if command -v luci-reload >/dev/null 2>&1; then
              echo "使用 luci-reload 刷新 LuCI..."
              luci-reload 2>/dev/null || true
            else
              # 使用 Lua 直接重建索引（兼容不同版本函数名）
              if command -v lua >/dev/null 2>&1; then
                echo "使用 Lua 重建 LuCI 索引..."
                lua -e 'local ok,d=pcall(require,"luci.dispatcher"); if ok and d then if d.rebuild_index then d.rebuild_index() elseif d.createindex then d.createindex() end end' 2>/dev/null || true
              fi
              # 使用 ucode 重建索引（iStoreOS 25 / OpenWrt 24.10+）
              if command -v ucode >/dev/null 2>&1; then
                echo "使用 ucode 重建 LuCI 索引..."
                ucode -e 'require("luci.dispatcher").rebuild_index?.()' 2>/dev/null || true
              fi

              # 温和地重载 HTTP 服务（不重启）
              if [ -x /etc/init.d/uhttpd ]; then
                echo "重载 uhttpd..."
                /etc/init.d/uhttpd reload 2>/dev/null || true
              fi
              if [ -x /etc/init.d/nginx ]; then
                echo "重载 nginx..."
                /etc/init.d/nginx reload 2>/dev/null || true
              fi
              if [ -x /etc/init.d/rpcd ]; then
                echo "重载 rpcd..."
                /etc/init.d/rpcd reload 2>/dev/null || true
              fi
            fi

            # 确保文件系统同步
            sync
          }

          # 使用固定文件名（保留扩展名 ipk/apk，由构建脚本按 SDK 版本决定）
          APP_PKG="luci-app-passwall.ipk"
          I18N_PKG="luci-i18n-passwall-zh-cn.ipk"
          if [ "$PKG_MGR" = "apk" ]; then
            [ -f "luci-app-passwall.apk" ] && APP_PKG="luci-app-passwall.apk"
            [ -f "luci-i18n-passwall-zh-cn.apk" ] && I18N_PKG="luci-i18n-passwall-zh-cn.apk"
          fi

          if [ ! -f "$APP_PKG" ]; then
            echo "错误: 缺少 $APP_PKG"
            ls -l
            exit 1
          fi

          # 安装前轻度刷新
          refresh_luci

          # 更新软件源
          if [ "$PKG_MGR" = "apk" ]; then
              apk update || { echo "apk update 失败，请检查路由器网络以及软件源。"; exit 1; }
          else
              opkg update || { echo "更新软件源列表错误，请检查路由器网络以及软件源。"; exit 1; }
          fi

          # 安装基础依赖（容错，按 SDK 版本分支）
          echo "安装基础依赖..."
          case "$SDK_VERSION" in
              22.03*|19.07*|18.06*)
                  # 旧版 OpenWrt / iStoreOS 22.03：Lua + luci-compat
                  for dep in luci-compat luci-lib-jsonc libuci-lua; do
                      install_dep "$dep" 2>/dev/null || true
                  done
                  ;;
              *)
                  # iStoreOS 25 / OpenWrt 24.10+：ucode + rpcd，无 luci-compat
                  for dep in luci-lib-jsonc libuci-lua ucode ucode-mod-lua; do
                      install_dep "$dep" 2>/dev/null || true
                  done
                  ;;
          esac

          # 检查并安装 PassWall 必需依赖
          check_passwall_deps

          # 安装 depends 下的依赖包（opkg 装 ipk；apk 装 apk，无 apk 则跳过）
          if [ -d depends ]; then
            echo "安装依赖包..."
            if [ "$PKG_MGR" = "apk" ]; then
              if ls depends/*.apk >/dev/null 2>&1; then
                apk add -q --force-overwrite --clean-protected --allow-untrusted depends/*.apk || true
              fi
            elif ls depends/*.ipk >/dev/null 2>&1; then
              opkg install depends/*.ipk || true
            fi
          fi

          # 额外常用组件（容错）
          echo "安装额外组件..."
          if [ "$PKG_MGR" = "apk" ]; then
              apk add -q --force-overwrite --clean-protected --allow-untrusted haproxy shadowsocks-libev-ss-local shadowsocks-libev-ss-redir shadowsocks-libev-ss-server 2>/dev/null || true
          else
              opkg install haproxy shadowsocks-libev-ss-local shadowsocks-libev-ss-redir shadowsocks-libev-ss-server 2>/dev/null || true
          fi

          # 始终强制重装，避免版本判断带来的不确定性
          echo "安装 PassWall 主程序..."
          if [ "$PKG_MGR" = "apk" ]; then
              apk add -q --force-overwrite --clean-protected --allow-untrusted "$APP_PKG" || exit 1
          else
              opkg install "$APP_PKG" --force-reinstall || exit 1
          fi

          # 安装中文语言包（仅本地文件）
          if [ -f "$I18N_PKG" ]; then
            echo "安装中文语言包: $I18N_PKG"
            if [ "$PKG_MGR" = "apk" ]; then
              apk add -q --force-overwrite --clean-protected --allow-untrusted "$I18N_PKG" || true
            else
              opkg install "$I18N_PKG" || true
            fi
          else
            echo "未发现本地中文语言包，跳过安装"
          fi

          # 启用并启动服务
          if [ -x /etc/init.d/passwall ]; then
            echo "启用 PassWall 服务..."
            /etc/init.d/passwall enable 2>/dev/null || true
            /etc/init.d/passwall start 2>/dev/null || true
          fi

          # 重载防火墙（不重启）
          if [ -x /etc/init.d/firewall ]; then
            echo "重载防火墙规则..."
            /etc/init.d/firewall reload 2>/dev/null || true
          fi

          # 安装后轻度刷新
          refresh_luci

          # 验证安装结果（兼容 lua 与 ucode 控制器）
          if [ -f /usr/lib/lua/luci/controller/passwall.lua ] || \
             ls /usr/lib/lua/luci/controller/passwall/*.lua >/dev/null 2>&1 || \
             find /usr/lib/lua/luci /usr/share/ucode/luci -name "*passwall*" -type f >/dev/null 2>&1; then
            echo "✓ 安装完成！请在 LuCI 界面 服务→PassWall 查看。"
            echo "  如果菜单未显示，请刷新浏览器或重新登录 LuCI。"
            exit 0
          else
            echo "! 警告：未检测到 PassWall 控制器文件，可能需刷新浏览器或重新登录 LuCI。"
            exit 0
          fi
          EOF
          chmod +x "$STAGING_DIR/install.sh"

          # 把占位符 @SDK_VERSION@ 替换为构建时的 SDK 版本
          sed -i "s|@SDK_VERSION@|$SDK_VERSION|g" "$STAGING_DIR/install.sh"

          OUTPUT="PassWall_${APP_VERSION}_${ARCH_MAP}_all_sdk_${SDK_VERSION}.run"
          LABEL="PassWall_${APP_VERSION}_with_sdk_${SDK_VERSION}_${OPENSSL_TAG}"
          makeself --gzip --nox11 "$STAGING_DIR" "$OUTPUT" "$LABEL" ./install.sh

          echo "PassWall(luci-app)版本: $APP_VERSION" > version.txt
          echo "上游Release Tag: $LATEST_VERSION" >> version.txt
          echo "SDK版本: $SDK_VERSION" >> version.txt
          echo "OpenSSL标记: $OPENSSL_TAG" >> version.txt
          echo "构建时间: ${{ steps.date.outputs.date }}" >> version.txt
          echo "目标架构: ${{ inputs.target_arch }}" >> version.txt
          echo "GitHub Actions运行ID: ${{ github.run_id }}" >> version.txt
          echo "构建选项: ${{ inputs.build_option }}" >> version.txt

          rm -rf artifact/installer/*
          mv -f "$OUTPUT" artifact/installer/
          mv -f version.txt artifact/installer/
          echo "构建产物："
          ls -lh artifact/installer/

      - name: 上传安装程序
        uses: actions/upload-artifact@v4
        with:
          name: PassWall_${{ steps.parsever.outputs.appver }}_${{ inputs.target_arch }}_all_sdk_${{ inputs.sdk_version }}
          path: ./artifact/installer/

      - name: 创建发布
        uses: softprops/action-gh-release@v1
        with:
          tag_name: passwall-${{ inputs.target_arch }}-${{ steps.parsever.outputs.appver }}-${{ github.run_id }}
          name: PassWall ${{ steps.parsever.outputs.appver }} for iStoreOS (${{ inputs.target_arch }})
          files: |
            artifact/installer/PassWall_${{ steps.parsever.outputs.appver }}_${{ inputs.target_arch }}_all_sdk_${{ inputs.sdk_version }}.run
            artifact/installer/version.txt
          body: |
            ## PassWall ${{ steps.parsever.outputs.appver }} for iStoreOS - ${{ inputs.target_arch }}

            PassWall(luci-app)版本: ${{ steps.parsever.outputs.appver }}
            上游Release Tag: ${{ steps.fetch.outputs.version }}
            SDK版本: ${{ inputs.sdk_version }}
            OpenSSL标记: ${{ inputs.openssl_tag }}
            构建时间: ${{ steps.date.outputs.date }}
            目标架构: ${{ inputs.target_arch }}
            GitHub Actions运行ID: ${{ github.run_id }}
            构建选项: ${{ inputs.build_option }}
            
            ### 安装方法
            
            1. 下载 `PassWall_${{ steps.parsever.outputs.appver }}_${{ inputs.target_arch }}_all_sdk_${{ inputs.sdk_version }}.run` 到路由器
            2. 执行 `chmod +x PassWall_${{ steps.parsever.outputs.appver }}_${{ inputs.target_arch }}_all_sdk_${{ inputs.sdk_version }}.run && ./PassWall_${{ steps.parsever.outputs.appver }}_${{ inputs.target_arch }}_all_sdk_${{ inputs.sdk_version }}.run`
            3. 完成后，在LuCI界面中访问 服务→PassWall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}